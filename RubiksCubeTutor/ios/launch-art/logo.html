<!doctype html><meta charset="utf-8">
<style>
@font-face { font-family: 'Fredoka'; font-weight: 400 700; src: url('../../fonts/fredoka-latin-var.woff2') format('woff2'); }
html, body { margin: 0; background: transparent; }
/* 1x canvas: 300 x 196 points */
.logo { width: 300px; height: 196px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 8px; box-sizing: border-box; }
.face { width: 124px; height: 124px; border-radius: 28px; background: #1a1b23; padding: 7px; box-sizing: border-box;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; box-shadow: 0 0 0 var(--rim) rgba(255,255,255,0.22), 0 6px 16px rgba(20, 20, 40, var(--sh)); }
.face i { border-radius: 9px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.13); }
.Y { background: #ffd500; } .G { background: #00a651; } .R { background: #d3202b; }
.B { background: #0055d4; } .W { background: #ffffff; } .O { background: #ff7a00; }
.word { margin-top: 18px; font: 700 33px/1 'Fredoka', sans-serif; color: var(--ink); letter-spacing: 0.2px; white-space: nowrap; }
.word sup { font-size: 0.45em; font-weight: 600; vertical-align: top; position: relative; top: 1px; margin-left: 1px; }
</style>
<div class="logo">
  <div class="face"><i class="Y"></i><i class="G"></i><i class="R"></i><i class="B"></i><i class="W"></i><i class="O"></i><i class="O"></i><i class="R"></i><i class="Y"></i></div>
